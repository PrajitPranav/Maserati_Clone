<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maserati Model Selector</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: white;
      color: black;
      padding: 40px;
    }



    nav {
      display: flex;
      gap: 30px;
    }

    nav a {
      text-decoration: none;
      color: black;
      font-weight: 500;
    }

    .logo {
      text-align: center;
    }

    .logo img {
      height: 40px;
    }



    h2 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 36px;
    }

    .car-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 40px;
      justify-items: center;
    }

    .car-card {
      text-align: center;
    }

    .car-card img {
      width: 100%;
      max-width: 300px;
      height: auto;
    }

    .car-name {
      font-size: 20px;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .select-btn {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid black;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-transform: uppercase;
      background: transparent;
      transition: all 0.3s ease;
      min-width: 200px;
    }

    .select-btn:hover {
      background-color: #000;
      color: white;
    }

    .select-btn::after {
      content: '➝';
      margin-left: 10px;
      transition: transform 0.3s ease;
    }

    .select-btn:hover::after {
      transform: translateX(4px);
    }
  </style>
</head>
<body>
    <header>
        <nav>
          <a href="Home.html">Home</a>
          <a href="Models.html">Models</a>
          <a href="#">About us</a>
        </nav>
        <div class="logo">
            <img src="LOGO.jpg" alt="Maserati Logo">
        </div>
    </header>
    <br><br><br><br>
  

  <div class="car-grid">
    <!-- Car Cards -->
    <div class="car-card">
      <div class="car-name">Quattroporte</div>
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR9k5LcAqMKdkvU9FbbbDMce9jfSOKyv2quLFVpPj2f7tEg81pRxd6yuKcZlAaVau64sdc&usqp=CAU" alt="Grecale">
      <button class="select-btn" onclick="window.location.href='Configurator.html'">Check</button>

    </div>
    <div class="car-card">
      <div class="car-name">Qatar-Edition</div>
      <img src="https://ymimg1.b8cdn.com/uploads/car_model/3668/pictures/3354042/01.jpg" alt="GranTurismo"><br><br>
      <button class="select-btn">Check</button>
    </div>
    <div class="car-card">
      <div class="car-name"> MC20</div>
      <img src="https://maserati.scene7.com/is/image/maserati/maserati/international/Models/default/2023/mc20/MC20_front.png?$800x2000$&fmt=png-alpha&fit=constrain" alt="GranCabrio">
      <br><br><br>
      <button class="select-btn">Check</button>
    </div>
    <div class="car-card">
      <div class="car-name">MC20-Convertible</div>
      <img src="https://maserati.scene7.com/is/image/maserati/maserati/international/Models/default/2023/mc20sr/MC20-cielo_front.png?$800x2000$&fmt=png-alpha&fit=constrain" alt="MC20">
      <br><br><br>
      <button class="select-btn">Check</button>
    </div>
    <div class="car-card">
      <div class="car-name"> GT-2</div><br>
      <img src="https://maserati.scene7.com/is/image/maserati/maserati/international/Models/default/2025/gt2-stradale/versions/gt2-stradale.jpg?$1920x2000$&fit=constrain" alt="MC20 Cielo">
      <br><br><br><br>
      <button class="select-btn">Check</button>
    </div>
    <!-- <div class="car-card">
      <div class="car-name">Levante GT</div>
      <img src="https://cars.usnews.com/static/images/Auto/izmo/i159615379/2023_maserati_levante_angularfront.jpg" alt="GT2 Stradale">
      <button class="select-btn">Check</button>
    </div> -->
  </div>

</body>
</html>
