<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghibli</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      font-family: 'Roboto', sans-serif;
      height: 100%;
      background: black;
      color: white;
    }
    body {
      overflow-x: hidden;
    }
    header {
      position: fixed;
      width: 100%;
      top: 0;
      left: 0;
      z-index: 10;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: transparent;
      transition: background 0.3s ease;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: white;
    }
    .nav-links {
      display: flex;
      gap: 20px;
    }
    .nav-links a {
      color: white;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 14px;
    }
    .hero {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: -2;
    }
    .hero video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .overlay-scroll {
      position: relative;
      width: 100%;
      z-index: 0;
      background-image: url('wp4171814-maserati-ghibli-wallpapers.jpg'); 
      background: size 50px;

      background-position:top;
      background-repeat: no-repeat;
    }
    .text-scroll {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .scroll-text {
      font-size: 48px;
      font-family: 'Playfair Display', serif;
      color: rgba(255, 255, 255, 0.8);
      max-width: 70%;
      text-align: center;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 1s ease, transform 1s ease;
    }
    .scroll-text.exit {
      opacity: 0;
      transform: translateY(-100%);
    }
    .scroll-text.reenter {
      opacity: 1;
      transform: translateY(0);
    }
    .spacer {
      height: 150vh;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo"><b>G H I B L I</b></div>
    <nav class="nav-links">
      <a href="#">Overview</a>
      <a href="#">Design</a>
      <a href="#">Innovation</a>
      <a href="#">Performance</a>
      <a href="#">Collection</a>
    </nav>
    <button style="background: #f3c219; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer;" onclick="window.location.href='BuildYourOwnPAGE.html'">Build Your Own</button>
  </header>

  <section class="hero">
    <video autoplay muted loop>
      <source src="Maserati%20Ghibli%20Trofeo.%20The%20Art%20of%20Fast.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>
  </section>

  <div class="overlay-scroll">
    <section class="text-scroll">
      <div class="scroll-text" id="scrollText">The luxury sport Sedan to defy the ordinary. A distinctive statement in a world of standardized choices.</div>
    </section>

    <div class="spacer"></div>
  </div>

  <script>
    const scrollText = document.getElementById('scrollText');
    let lastScrollTop = 0;

    window.addEventListener('scroll', () => {
      const scrollTop = window.scrollY;
      const scrollPosition = scrollText.getBoundingClientRect().top;

      if (scrollTop > lastScrollTop) {
        if (scrollPosition < window.innerHeight / 2) {
          scrollText.classList.add('exit');
        }
      } else {
        if (scrollPosition > 0 && scrollPosition < window.innerHeight) {
          scrollText.classList.remove('exit');
        }
      }

      lastScrollTop = scrollTop;
    });
  </script>
</body>
</html>
